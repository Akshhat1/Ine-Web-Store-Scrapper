services:
  - type: web
    name: ine-price-tracker-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ENABLE_BROWSER
        value: false
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPE_TIMEOUT_MS
        value: 30000
      - key: MAX_RETRIES
        value: 3
      - key: PRICE_JUMP_THRESHOLD
        value: 0.5
      - key: RUN_TIME_BUDGET_MS
        value: 600000
